name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DEEPSEEK_API_KEY: ci-dummy-key
  MAIN_DB_PASSWORD: ci
  MAIN_DB_NAME: ci_app
  SESSION_DB_PASSWORD: ci
  SESSION_DB_NAME: ci_session
  PRODUCT_VECTOR_DB_PASSWORD: ci
  PRODUCT_VECTOR_DB_NAME: ci_vector

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check app tests

      - name: Ruff format
        run: ruff format --check app tests

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -q
